# gitleaks configuration.
#
# This file EXTENDS the default rule set (useDefault = true) — it does not
# replace it — so every built-in rule and the default global allowlist stay
# active everywhere in the repo.
#
# The configuration-guard tests use low-value, sequential dummy values for
# ADMIN_KEY / LOCK_HASH_SECRET / SECRET_20 so they can assert length and format
# validation. gitleaks' generic-api-key rule flags those literals, but they are
# test fixtures, not credentials.
#
# The patterns are anchored (^...$) so they match only a secret that is exactly
# one of these values — an unrelated real key that merely contains the same
# substring is still reported.
[extend]
useDefault = true

[allowlist]
description = "Sequential dummy secrets used only by configuration-guard tests"
regexes = [
    '''^0123456789abcdef$''',
    '''^0123456789abcdefghij$''',
    '''^9876543210zyxwvutsrq$''',
]
#
# PostHog public ingestion token (the audited activation design, PRs #2/#3)
# embeds the browser-side project token in the frontend bootstrap. It is a
# PUBLIC PostHog project token by design — not a private credential — and
# gitleaks' generic-api-key rule flags the assignment regardless. The
# per-rule allowlist below, attached to generic-api-key only, exempts the
# exact POSTHOG_TOKEN = 'phc_…' bootstrap line shape and nothing else:
# all other rules, files, lines, and value shapes stay fully enforced
# empirically (negative controls: an AWS-style key, a phx_ token, and a
# phc_ value under a non-PostHog variable name were still reported).
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public PostHog ingestion token bootstrap (public phc_ client token by audited design)"
regexTarget = "line"
regexes = [
    '''(?i)POSTHOG_TOKEN\s*=\s*['\"]phc_'''
]
