<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>GikoMart Admin</title>
<link rel="stylesheet" href="/assets/css/admin.css">
<!-- Inline SVG favicon: kills the /favicon.ico 404 on every load with no
     extra request and no new file. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E">
<!-- Moved to <head> with defer: fetching/compiling starts during HTML
     parsing instead of after the body. defer keeps execution after the DOM
     is parsed and before DOMContentLoaded; the wire-up in admin.js also
     guards itself with a DOMContentLoaded listener. -->
<script src="/assets/js/admin.js" defer></script>
</head>
<body>
<header class="bar">
  <h1>GikoMart Admin</h1>
  <button id="signOutBtn" type="button" hidden>Sign out</button>
</header>
<main>
  <section id="loginSection">
    <h2>Admin sign-in</h2>
    <form id="loginForm" autocomplete="off" novalidate>
      <label for="adminKey">Admin key</label>
      <input id="adminKey" type="password" autocomplete="off">
      <label for="totpCode">Authenticator code</label>
      <input id="totpCode" type="text" inputmode="numeric" autocomplete="off" maxlength="6">
      <button id="loginBtn" type="submit">Sign in</button>
      <p id="loginMsg" role="alert"></p>
    </form>
  </section>
  <section id="appSection" hidden>
    <nav id="tabs">
      <button type="button" class="tab" data-view="dashboard">Dashboard</button>
      <button type="button" class="tab" data-view="reports">Reports</button>
      <button type="button" class="tab" data-view="payments">Payments</button>
      <button type="button" class="tab" data-view="grants">Grant requests</button>
      <button type="button" class="tab" data-view="blocks">Blocks</button>
      <button type="button" class="tab" data-view="audit">Audit log</button>
      <button type="button" class="tab" data-view="health">Health</button>
      <button type="button" class="tab" data-view="grant">Grant</button>
    </nav>
    <p id="viewMsg" role="status"></p>
    <div id="viewBody"></div>
  </section>
</main>
</body>
</html>
