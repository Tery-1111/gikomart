# CI: lint + test on every push and pull request so error sweeps are automatic.
# (The release-triggered publish workflow lives in npm-publish-github-packages.yml.)
#
# The vitest suite mocks MongoDB, Cloudinary, IntaSend and WhatsApp, so no
# service containers are needed — npm ci && npm test is self-contained.
name: CI

on:
  push:
  pull_request:

# Superseded runs on the same branch are cancelled to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Asset version guard
        run: node scripts/check-asset-version.js

      - name: Test
        run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gitleaks needs full history to scan past commits

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan for secrets
        run: gitleaks detect --source . --no-banner --redact --exit-code 1

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24         # match the existing job's node version
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high --omit=dev
